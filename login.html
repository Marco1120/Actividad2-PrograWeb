<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Login</title>
        <link rel="stylesheet" href="css/styles.css">
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
        <script src="js/utileria.js"></script>
    </head>
    <body>
        <div class="titulo">
            <h1>Iniciar Sesión</h1>
            <p class="subtitulo">Ingrese su correo electrónico y contraseña.</p>

            <form id="login" novalidate>
                <div class="correo">
                    <label for="email">Correo electrónico</label>
                    <input type="email" id="email" placeholder="Ej: marco@ejemplo.com" autocomplete="email">
                    <p class="error" id="error-email"></p>
                </div>

                <div class="campo">
                    <label for="password">Contraseña</label>
                    <div class="fila-password">
                        <input type="password" id="password" placeholder="Ingrese su contraseña" autocomplete="current-password">
                    </div>
                    <p class="error" id="error-password"></p>
                </div>

                <button type="submit" class="btn-principal">Ingresar</button>
                <p class="mensaje oculto" id="mensaje" role="status"></p>
            </form>
        </div>
        <p class="enlace"><a href="index.html">Registrarse</a></p>

        <script>
            function marcar(id, mensaje) {
                var input = document.getElementById(id);
                document.getElementById("error-" + id).textContent = mensaje;
                input.classList.toggle("invalido", mensaje !== "");
                input.classList.toggle("valido", mensaje === "" && input.value !== "");
            }

            document.getElementById("login").addEventListener("submit", function (e) {
                e.preventDefault();

                var correo = document.getElementById("email").value.trim();
                var password = document.getElementById("password").value;
                var mensaje = document.getElementById("mensaje");

                // Aquí se llaman las funciones de utileria.js
                var correoOk = validarCorreo(correo);
                var passwordOk = validarPassword(password);

                marcar("email", correoOk ? "" : "Escribe un correo válido, por ejemplo nombre@dominio.com.");
                marcar("password", passwordOk ? "" : "Mínimo 8 caracteres, con mayúscula, minúscula, número y carácter especial.");

                mensaje.classList.remove("oculto", "ok", "mal");
                if (correoOk && passwordOk) {
                    mensaje.classList.add("ok");
                    mensaje.textContent = "Acceso correcto. Bienvenido, " + correo + ".";
                } else {
                    mensaje.classList.add("mal");
                    mensaje.textContent = "Revisa los campos marcados.";
                }
            });
        </script>
    </body>
</html>
